openapi: 3.0.3
servers:
  - url: "http://localhost:3000"

info:
  title: WASAText
  description: |-
    WASAText is a PC based messaging platform that allows 
    users to communicate with contacts and groups.
  version: 1.0.0

tags:
  - name: login
    description: Simplified login
  - name: user
    description: The logged-in user and the other users
  - name: conversation
    description: One-to-one and group conversations
  - name: message
    description: Messages inside a conversation
  - name: comment
    description: Reactions (comments) on messages
  - name: group
    description: Group management

security:
  - bearerAuth: []

paths:
  /session:
    post:
      tags: ["login"]
      summary: Logs in the user
      description: |-
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      security: []
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              description: The username to log in with
              type: object
              properties:
                name: { $ref: "#/components/schemas/Username" }
              required: [name]
        required: true
      responses:
        "201":
          description: User log-in action successful
          content:
            application/json:
              schema:
                description: Identifier to use as Bearer token
                type: object
                properties:
                  identifier: { $ref: "#/components/schemas/ResourceId" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /me/username:
    put:
      tags: ["user"]
      summary: Changes my username
      description: |-
        Sets a new username for the logged-in user. The new name must not
        be already used by another user.
      operationId: setMyUserName
      requestBody:
        description: New username
        required: true
        content:
          application/json:
            schema:
              description: New username
              type: object
              properties:
                name: { $ref: "#/components/schemas/Username" }
              required: [name]
      responses:
        "200":
          description: Username updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The username is already used by another user
        "500": { $ref: "#/components/responses/InternalServerError" }







#Da fare
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The user identifier returned by doLogin

  schemas: 
    Username:
      description: A WASAText username
      type: string
      example: Maria
      pattern: '^.*?$'
      minLength: 3
      maxLength: 16

    ResourceId:
      description: Unique numeric identifier
      type: integer
      format: int64
      minimum: 1
      example: 42
    
    User:
      description: A WASAText user
      type: object
      properties:
        id: { $ref: "#/components/schemas/ResourceId" }
        name: { $ref: "#/components/schemas/Username" }
        photo: { $ref: "#/components/schemas/Photo" }
      required: [id, name]

    Photo:
      description: Image encoded in base64
      type: string
      format: byte
      minLength: 0
      maxLength: 10000000



  responses:
    Unauthorized:
      description: The access token is missing or it's expired
    BadRequest:
      description: The request was not compliant with the documentation (eg. missing fields, etc)
    InternalServerError:
      description: The server encountered an internal error. Further info in server logs


  parameters:
    cat:
      schema:
        type: string
        pattern: '^[a-zA-Z]+$'
        minLength: 3
        maxLength: 10
      name: cat
      in: path
      required: true
      description: Cat
      allowEmptyValue: false
