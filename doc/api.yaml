openapi: 3.0.3
servers:
  - url: "http://localhost:3000"

info:
  title: WASAText
  description: |-
    Connect with your friends effortlessly using WASAText! Send and receive messages, whether one-on-one
    or in groups, all from the convenience of your PC. Enjoy seamless conversations with text or GIFs and
    easily stay in touch through your private chats or group discussions
  version: 1.0.0

tags:
  - name: login
    description: Simplified login
  - name: user
    description: The logged-in user and the other users
  - name: conversation
    description: Private and group conversations
  - name: message
    description: Messages inside a conversation
  - name: comment
    description: Reactions (comments) on messages
  - name: group
    description: Group management
  - name: photo
    description: User or group's photo

security:
  - bearerAuth: []

# ===============================================
# PATHS
# ===============================================

paths:
  /session:
    post:
      tags: ["login"]
      summary: Logs in the user
      description: |-
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned
      operationId: doLogin
      security: []
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              description: The username to log in with
              type: object
              properties:
                name: { $ref: "#/components/schemas/Username" }
              required: [name]
        required: true
      responses:
        "201":
          description: User log-in action successful
          content:
            application/json:
              schema:
                description: Identifier to use as Bearer token
                type: object
                properties:
                  identifier: { $ref: "#/components/schemas/ResourceId" }
              example:
                identifier: 42              
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    
  /me/username:
    put:
      tags: ["user"]
      summary: Changes my username
      description: |-
        Sets a new username for the logged-in user. The new name must not
        be already in use
      operationId: setMyUserName
      requestBody:
        description: The new username
        required: true
        content:
          application/json:
            schema:
              description: New username
              type: object
              properties:
                name: { $ref: "#/components/schemas/Username" }
              required: [name]
      responses:
        "200":
          description: Username updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The username is already used by another user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /me/photo:
    put:
      tags: ["user"]
      summary: Changes my profile photo
      description: Uploads a new profile photo for the logged-in user
      operationId: setMyPhoto
      requestBody:
        description: The new photo
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/PhotoUpload" }
      responses:
        "200":
          description: Photo updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    
  /photos/{photoId}:
    parameters:
      - $ref: "#/components/parameters/PhotoId"
    get:
      tags: ["photo"]
      summary: Downloads a photo
      description: |-
        Returns the image file (profile, group or message photo). JSON
        objects only contain the URL of this endpoint. 
        It needs no Authorization header, so anyone can see
        the photo if they know the URL
      operationId: getPhoto
      security: []
      responses:
        "200":
          description: The image file
          content:
            image/*:
              schema: { $ref: "#/components/schemas/ImageFile" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  
  /users:
    get:
      tags: ["user"]
      summary: Lists or searches users
      description: |-
        Returns all WASAText users. If the "username" parameter is given,
        only users with that text in the username are returned
      operationId: searchUsers
      parameters:
      - name: username
        in: query
        description: Text to search in the usernames
        schema:
          type: string
          pattern: '^.*?$'
          minLength: 1
          maxLength: 16
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                description: Search results
                type: object
                properties:
                  users:
                    description: Users found
                    type: array
                    minItems: 0
                    maxItems: 1000
                    items: { $ref: "#/components/schemas/User" }
                required: [users]
              example:
                users:
                  - id: 42
                    name: Maria
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /conversations:
    get:
      tags: ["conversation"]
      summary: Lists my conversations
      description: |-
        Returns the conversations of the logged-in user, private and
        groups, in reverse chronological order (latest message first)
      operationId: getMyConversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                description: User's conversations list
                type: object
                properties:
                  conversations:
                    description: The user's conversations
                    type: array
                    minItems: 0
                    maxItems: 1000
                    items: { $ref: "#/components/schemas/ConversationSummary" }
                required: [conversations]
              example:
                conversations:
                  - id: 7
                    type: direct
                    name: Luca
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      tags: ["conversation"]
      summary: Starts a private conversation
      description: |-
        Starts a conversation with another user. If a conversation with
        that user already exists, it is returned instead
      operationId: startConversation
      requestBody:
        description: The user to talk to
        required: true
        content:
          application/json:
            schema:
              description: Other user
              type: object
              properties:
                userId: { $ref: "#/components/schemas/ResourceId" }
              required: [userId]
      responses:
        "200":
          description: The conversation already existed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "201":
          description: Conversation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: ["conversation"]
      summary: Opens a conversation
      description: |-
        Returns the conversation with all its messages 
        in reverse chronological order
      operationId: getConversation
      responses:  
        "200":
          description: The conversation and its messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound"}
        "500": { $ref: "#/components/responses/InternalServerError" }

  /conversations/{conversationId}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      tags: ["message"]
      summary: Sends a new message
      description: |-
        Sends a new message (text, photo or both) in the conversation
      operationId: sendMessage
      requestBody:
        description: The message to send
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/NewMessage" }
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /conversations/{conversationId}/messages/{messageId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/MessageId"
    delete:
      tags: ["message"]
      summary: Deletes a message
      description: Deletes a message sent by the logged-in user
      operationId: deleteMessage
      responses:
        "204":
          description: Message deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
 
  /conversations/{conversationId}/messages/{messageId}/forwards:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: ["message"]
      summary: Forwards a message
      description: |-
        Copies the message into another conversation of the logged-in
        user. The new message is marked as forwarded
      operationId: forwardMessage
      requestBody:
        description: Destination conversation
        required: true
        content:
          application/json:
            schema:
              description: Where to forward the message
              type: object
              properties:
                destinationId: { $ref: "#/components/schemas/ResourceId" }
              required: [destinationId]
      responses:
        "201":
          description: Message forwarded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
 
  /conversations/{conversationId}/messages/{messageId}/comments:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: ["comment"]
      summary: Reacts to a message
      description: Adds a reaction (an emoji) to the message
      operationId: commentMessage
      requestBody:
        description: The reaction
        required: true
        content:
          application/json:
            schema:
              description: Reaction content
              type: object
              properties:
                emoji: { $ref: "#/components/schemas/Emoji" }
              required: [emoji]
      responses:
        "201":
          description: Reaction added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
 
  /conversations/{conversationId}/messages/{messageId}/comments/{commentId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/MessageId"
      - $ref: "#/components/parameters/CommentId"
    delete:
      tags: ["comment"]
      summary: Removes my reaction
      description: Removes a reaction posted by the logged-in user
      operationId: uncommentMessage
      responses:
        "204":
          description: Reaction removed
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /groups:
    post:
      tags: ["group"]
      summary: Creates a group
      description: |-
        Creates a new group conversation with the logged-in user and the
        members specified in the request body
      operationId: createGroup
      requestBody:
        description: Group name and initial members
        required: true
        content:
          application/json:
            schema:
              description: New group
              type: object
              properties:
                name: { $ref: "#/components/schemas/GroupName" }
                members:
                  description: Identifiers of the other members
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { $ref: "#/components/schemas/ResourceId" }
              required: [name, members]
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /groups/{groupId}/members:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      tags: ["group"]
      summary: Adds a user to a group
      description: |-
        Adds another user to a group. Only members of the group can add
        new members.
      operationId: addToGroup
      requestBody:
        description: The user to add
        required: true
        content:
          application/json:
            schema:
              description: User to add
              type: object
              properties:
                userId: { $ref: "#/components/schemas/ResourceId" }
              required: [userId]
      responses:
        "200":
          description: User added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /groups/{groupId}/members/me:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    delete:
      tags: ["group"]
      summary: Leaves a group
      description: Removes the logged-in user from the group.
      operationId: leaveGroup
      responses:
        "204":
          description: Group left
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /groups/{groupId}/name:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    put:
      tags: ["group"]
      summary: Renames a group
      description: Sets a new name for the group.
      operationId: setGroupName
      requestBody:
        description: The new group name
        required: true
        content:
          application/json:
            schema:
              description: New name
              type: object
              properties:
                name: { $ref: "#/components/schemas/GroupName" }
              required: [name]
      responses:
        "200":
          description: Group renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /groups/{groupId}/photo:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    put:
      tags: ["group"]
      summary: Changes the group photo
      description: Uploads a new photo for the group.
      operationId: setGroupPhoto
      requestBody:
        description: The new photo
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/PhotoUpload" }
      responses:
        "200":
          description: Group photo updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }



# ===============================================
# COMPONENTS
# ===============================================

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The user identifier returned by doLogin

  schemas: 
    Username:
      description: A WASAText username
      type: string
      example: Maria
      pattern: '^.*?$'
      minLength: 3
      maxLength: 16

    ResourceId:
      description: Unique numeric identifier
      type: integer
      format: int64
      minimum: 1
      example: 42
    
    Error:
      description: Details about an error
      type: object
      properties:
        message:
          description: Explanation of the error
          type: string
          pattern: '^.*?$'
          minLength: 1
          maxLength: 200
          example: The username is already used
      required: [message]
    
    User:
      description: A WASAText user
      type: object
      properties:
        id: { $ref: "#/components/schemas/ResourceId" }
        name: { $ref: "#/components/schemas/Username" }
        photo: { $ref: "#/components/schemas/Photo" }
      required: [id, name]
      example:
        id: 42
        name: Maria
        photo: "/photos/2"

    Photo:
      description: |-
        URL of the photo
      type: string
      pattern: '^/photos/[0-9]+$'
      minLength: 9
      maxLength: 30
      example: "/photos/2"

    ImageFile:
      description: Raw bytes of an image file
      type: string
      format: binary
      minLength: 1
      maxLength: 10000000
    
    PhotoUpload:
      description: A photo file to upload
      type: object
      properties:
        image: { $ref: "#/components/schemas/ImageFile" }
      required: [image]

    ConversationSummary:
      description: An element of the conversation list
      type: object
      properties:
        id: { $ref: "#/components/schemas/ResourceId" }
        type: { $ref: "#/components/schemas/ConversationType" }
        name:
          description: Other user's username, or the group name
          type: string
          pattern: '^.*?$'
          minLength: 1
          maxLength: 16
        photo: { $ref: "#/components/schemas/Photo" }
        lastMessage:
          description: Preview of the latest message, if any
          type: object
          properties:
            timestamp: { $ref: "#/components/schemas/Timestamp" }
            preview:
              description: First characters of the text, empty for photos
              type: string
              pattern: '^.*?$'
              minLength: 0
              maxLength: 50
            isPhoto:
              description: True if the message is a photo (show an icon)
              type: boolean
      required: [id, type, name]
 
    ConversationType:
      description: Private  or group conversation
      type: string
      enum: 
        - direct 
        - group
      example: direct
 
    Conversation:
      description: A conversation with its members and messages
      type: object
      properties:
        id: { $ref: "#/components/schemas/ResourceId" }
        type: { $ref: "#/components/schemas/ConversationType" }
        name:
          description: Other user's username, or the group name
          type: string
          pattern: '^.*?$'
          minLength: 1
          maxLength: 16
        photo: { $ref: "#/components/schemas/Photo" }
        members:
          description: Users in the conversation
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/User" }
        lastMessage:
          description: Preview of the latest message, if any
          type: object
          properties:
            timestamp: { $ref: "#/components/schemas/Timestamp" }
            preview:
              description: First characters of the text, empty for photos
              type: string
              pattern: '^.*?$'
              minLength: 0
              maxLength: 50
            isPhoto:
              description: True if the message is a photo (show an icon)
              type: boolean
        messages:
          description: Messages, newest first
          type: array
          minItems: 0
          maxItems: 10000
          items: { $ref: "#/components/schemas/Message" }
      required: [id, type, name, members]
      example:
        id: 7
        type: direct
        name: Luca
        members:
          - id: 42
            name: Maria
          - id: 43
            name: Luca

    Timestamp:
      description: A date and time
      type: string
      format: date-time
      minLength: 20
      maxLength: 30
      example: "2026-06-28T12:34:56.789Z"

    Message:
      description: A message inside a conversation
      type: object
      properties:
        id: { $ref: "#/components/schemas/ResourceId" }
        timestamp: { $ref: "#/components/schemas/Timestamp" }
        sender: { $ref: "#/components/schemas/User" }
        text:
          description: The text of the message
          type: string
          pattern: '^.*?$'
          minLength: 1
          maxLength: 10000
        photo: { $ref: "#/components/schemas/Photo" }
        forwarded:
          description: True if the message was forwarded
          type: boolean
        status:
          description: |-
            Delivery state. "received" = one checkmark, 
            "read" = two checkmarks 
          type: string
          enum: 
            - sent 
            - received 
            - read
        comments:
          description: Reactions on this message
          type: array
          minItems: 0
          maxItems: 1000
          items: { $ref: "#/components/schemas/Comment" }
      required: [id, sender, status]
      example:
        id: 3
        sender:
          id: 42
          name: Maria
        text: "Ciao!"
        status: read

    NewMessage:
      description: A message to send. At least one of text or image is required
      type: object
      properties:
        text:
          description: Text of the message
          type: string
          pattern: '^.*?$'
          minLength: 1
          maxLength: 10000
        image: { $ref: "#/components/schemas/ImageFile" }
    
    Comment:
      description: A reaction on a message
      type: object
      properties:
        id: { $ref: "#/components/schemas/ResourceId" }
        sender: { $ref: "#/components/schemas/User" }
        emoji: { $ref: "#/components/schemas/Emoji" }
      required: [id, sender, emoji]
      example:
        id: 1
        sender:
          id: 42
          name: Maria
        emoji: "👍"

    Emoji:
      description: A reaction emoji
      type: string
      pattern: '^.*?$'
      minLength: 1
      maxLength: 10
      example: "👍"

    GroupName:
      description: The name of a group
      type: string
      pattern: '^.*?$'
      minLength: 1
      maxLength: 16
      example: WASA study group



  responses:
    BadRequest:
      description: The request is not valid (wrong format or missing fields)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    
    Unauthorized:
      description: The Authorization header is missing or not valid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    
    Forbidden:
      description: The user is not allowed to do this action
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    
    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    
    InternalServerError:
      description: The server encountered an internal error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }


  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      description: Conversation identifier
      schema: { $ref: "#/components/schemas/ResourceId" }

    MessageId:
      name: messageId
      in: path
      required: true
      description: Message identifier
      schema: { $ref: "#/components/schemas/ResourceId"}

    CommentId:
      name: commentId
      in: path
      required: true
      description: Comment identifier
      schema: { $ref: "#/components/schemas/ResourceId"}
    
    PhotoId:
      name: photoId
      in: path
      required: true
      description: Photo identifier
      schema: { $ref: "#/components/schemas/ResourceId"}
    
    GroupId:
      name: groupId
      in: path
      required: true
      description: Group identifier (same as its conversation id)
      schema: { $ref: "#/components/schemas/ResourceId"}

